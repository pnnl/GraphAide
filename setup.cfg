# This file is used to configure your project.
# Read more about the various options under:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html

[metadata]
name = graphaide
version = 0.5.11
description = Multi-agentic knowledge graph construction and reasoning system
author = Sumit Purohit
author_email = sumit.purohit@pnnl.gov
license = MIT
license_files =
    LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/pnnl/GraphAide
project_urls =
    Source = https://github.com/pnnl/GraphAide/tree/develop
    Documentation = https://github.com/pnnl/GraphAide#quickstart
    Tracker = https://github.com/pnnl/GraphAide/issues
    License = https://github.com/pnnl/GraphAide/blob/develop/LICENSE.txt

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Artificial Intelligence


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

[options.packages.find]
where = src

# Require a min/specific Python version (comma-separated conditions)
python_requires = >=3.11,<3.14

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
install_requires =
    importlib-metadata==8.7.1
    openai==2.15.0
    langfuse>=4.0.0
    langchain>=1.0.7,<1.2.0
    sentence_transformers==5.2.1
    langchain_community
    langchain_openai
    langchain-chroma
    langgraph==1.0.8
    langgraph-prebuilt==1.0.7
    langchain-aws
    botocore[crt]>=1.42.0
    boto3>=1.42.0
    langchain-anthropic
    langchain_google_genai
    langchain-mcp-adapters
    langchain-neo4j==0.8.0
    fastmcp==2.14.5
    neo4j==6.1.0
    ragas==0.4.3
    pathlib==1.0.1
    pypdf==6.6.2
    pydantic==2.12.5
    rdflib>=6.0.0
    numba==0.61.2
    umap-learn==0.5.11
    plotly==6.5.2
    kaleido==0.2.1
    pandas==3.0.0
    numpy==2.2.6
    matplotlib==3.10.8
    dash==3.4.0
    py2neo==2021.2.4
    autogen-agentchat==0.7.5
    autogen-ext[openai]==0.7.5       
    python-dotenv==1.2.1
    ipykernel==7.1.0
    jupyterlab==4.5.3
    webencodings==0.5.1
    langchain-text-splitters==1.1.0
    typer[all]>=0.9.0
    fastapi>=0.110.0
    uvicorn[standard]>=0.29.0
    rich>=13.0.0
    qdrant-client>=1.18.0,<=1.18.0
    langchain-qdrant>=0.1.0
    pillow>=10.0.0
    pdf2image>=1.16.0

[options.package_data]

[options.data_files]
# IMPORTANT: DO NOT REMOVE templates entry - required for agent template loading at runtime
templates = templates/*.template
data = data/*.pdf, data/*.txt, data/*.nt

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install GraphAide[PDF]` like:
# PDF = ReportLab; RXP

# Add here test requirements (semicolon/line-separated)
testing =
    setuptools
    pytest
    pytest-cov

[options.entry_points]
console_scripts =
    graphaide = graphgen.cli:main

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov graphaide --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[tool:setuptools_scm]
write_to = src/graphaide/_version.py
write_to_template = __version__ = "{version}"

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.5
package = graphaide
