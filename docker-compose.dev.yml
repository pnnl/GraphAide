# GraphAide Docker Compose - Development Only
# Uses pre-built dev images from Docker Hub (with testing dependencies)
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#
# Port mapping:
#   GraphAide: http://localhost:8001
#   Neo4j HTTP: http://localhost:27474
#   Neo4j Bolt: bolt://localhost:27687

services:
  neo4j-dev:
    image: neo4j:5-community
    container_name: neo4j-dev
    ports:
      - "27474:7474"    # Neo4j HTTP
      - "27687:7687"    # Neo4j Bolt
    volumes:
      - neo4j-dev-data:/data
      - neo4j-dev-logs:/logs
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD_DEV:-dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_cypher_lenient__create__relationship: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - graphaide-network

  graphaide-dev:
    image: pnnl/graphaide:dev
    container_name: graphaide-dev-instance
    ports:
      - "8001:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${VECTOR_STORE_HOST_PATH:-./chroma}:/app/chroma
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-}
      OPENAI_EMBEDDING_MODEL_NAME: ${OPENAI_EMBEDDING_MODEL_NAME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      NEO4J_URI: bolt://neo4j-dev:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD_DEV:-dev_password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      VECTOR_STORE_PATH: /app/chroma
      VECTOR_STORE_NAME: ${VECTOR_STORE_NAME:-GA_VDB}
    depends_on:
      neo4j-dev:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - graphaide-network

volumes:
  neo4j-dev-data:
  neo4j-dev-logs:

networks:
  graphaide-network:
    driver: bridge
